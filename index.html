<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틱택토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>틱택토</h1>

  <div class="mode" role="radiogroup" aria-label="게임 모드">
    <button class="mode-btn" data-mode="ai" aria-pressed="true">vs 컴퓨터</button>
    <button class="mode-btn" data-mode="pvp" aria-pressed="false">2인 대결</button>
  </div>

  <div class="score">
    <div class="score-item x" id="score-x"><span class="label">X <small id="label-x">나</small></span><span class="num" id="num-x">0</span></div>
    <div class="score-item draw"><span class="label">무승부</span><span class="num" id="num-draw">0</span></div>
    <div class="score-item o" id="score-o"><span class="label">O <small id="label-o">컴퓨터</small></span><span class="num" id="num-o">0</span></div>
  </div>

  <div class="board-wrap">
    <div id="board" class="board"></div>
    <svg id="win-line" class="win-line"><line /></svg>
  </div>

  <div class="now" id="now">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <p id="status" class="status"></p>
  </div>

  <button id="reset" class="reset">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    다시 시작
  </button>
</main>
<script src="game.js"></script>
</body>
</html>
